services:
  - type: web
    name: dispute-autopilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: dispute-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: WEB_DIR
        value: /app/out
      - key: APP_MODE
        value: demo
      - key: APP_ORIGIN
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_MERCHANT_USER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL_NAME
        sync: false
